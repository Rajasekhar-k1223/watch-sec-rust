[package]
name = "agent-rust"
version = "2.2.10"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
ring = "0.17"
hex = "0.4"
mac_address = "1.1"
notify = "8.2.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring"] }
futures-util = "0.3.33"
lazy_static = "1.5.0"
regex = "1.13.1"
libloading = "0.8"
# gRPC Dependencies
tonic = "0.10"
prost = "0.12"
tokio-stream = "0.1"
chrono = "0.4"
base64 = "0.23.1"
enigo = "0.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }

[build-dependencies]
tonic-build = "0.10"

# Optimize for size
[profile.release]
opt-level = "z"  # Optimize for size.
lto = true       # Enable Link Time Optimization.
codegen-units = 1 # Reduce number of codegen units to increase optimizations.
# panic = "abort" removed — causes panic hook to not flush before exit on Windows
strip = true     # Automatically strip symbols from the binary.

[[bin]]
name = "test_net"
path = "test_net.rs"
