[package]
name = "monitorix-agent"
version = "4.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls", "trust-dns"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
ring = "0.17"
hex = "0.4"
mac_address = "1.1"
notify = "8.2.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3.33"
lazy_static = "1.5.0"
regex = "1.13.1"
libloading = "0.8"
# gRPC Dependencies
tonic = { version = "0.10", features = ["tls", "tls-roots"] }
prost = "0.12"
tokio-stream = "0.1"
chrono = "0.4"
base64 = "0.23.1"
enigo = "0.1"
arboard = "3.6.1"
image = "0.25.10"
windows = { version = "0.52.0", features = ["Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse"] }
ureq = "2.9.1"
[target.'cfg(windows)'.dependencies]
wmi = "0.13"
winreg = "0.52"
windows = { version = "0.52.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_System_EventLog", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Power", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
[build-dependencies]
tonic-build = "0.10"

# Optimize for size
[profile.release]
opt-level = "z"  # Optimize for size.
lto = true       # Enable Link Time Optimization.
codegen-units = 1 # Reduce number of codegen units to increase optimizations.
# panic = "abort" removed — causes panic hook to not flush before exit on Windows
strip = true     # Automatically strip symbols from the binary.

[[bin]]
name = "test_net"
path = "test_net.rs"

[[bin]]
name = "monitorix-screencapture"
path = "src/bin/screencapture.rs"
